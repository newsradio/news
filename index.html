<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsRadio 1620 - Newsroom Feed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #8B0000 0%, #DC143C 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #DC143C 0%, #8B0000 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header .logo {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #ddd;
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #DC143C;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .search-box:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(220, 20, 60, 0.2);
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .filter-btn {
            padding: 10px 20px;
            background: white;
            border: 2px solid #DC143C;
            color: #DC143C;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 14px;
        }

        .filter-btn:hover {
            background: #DC143C;
            color: white;
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: #DC143C;
            color: white;
        }

        .category-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .category-btn {
            padding: 8px 16px;
            background: white;
            border: 2px solid #999;
            color: #333;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .category-btn:hover {
            background: #f0f0f0;
            transform: translateY(-1px);
        }

        .category-btn.active {
            background: #333;
            color: white;
            border-color: #333;
        }

        /* Special styling for Press Releases */
        .category-btn.press-release {
            border-color: #FF6B35;
            color: #FF6B35;
        }

        .category-btn.press-release.active {
            background: #FF6B35;
            color: white;
        }

        /* Special styling for Government */
        .category-btn.government {
            border-color: #4A5899;
            color: #4A5899;
        }

        .category-btn.government.active {
            background: #4A5899;
            color: white;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            background: #fff;
            border-bottom: 2px solid #ddd;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stat {
            font-size: 14px;
        }

        .stat strong {
            color: #DC143C;
            font-size: 18px;
        }

        .refresh-btn {
            padding: 10px 24px;
            background: #DC143C;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: #8B0000;
            transform: scale(1.05);
        }

        .stories {
            padding: 20px 30px;
            max-height: calc(100vh - 500px);
            overflow-y: auto;
        }

        .story {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .story:hover {
            border-color: #DC143C;
            box-shadow: 0 4px 12px rgba(220, 20, 60, 0.15);
        }

        /* Press Release Special Styling */
        .story.press-release {
            border-left: 5px solid #FF6B35;
            background: #FFF9F5;
        }

        .story.government {
            border-left: 5px solid #4A5899;
            background: #F5F6FA;
        }

        .story-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .story-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge.local {
            background: #DC143C;
            color: white;
        }

        .badge.state {
            background: #FF6B35;
            color: white;
        }

        .badge.national {
            background: #4A90E2;
            color: white;
        }

        .badge.press-release {
            background: #FF6B35;
            color: white;
        }

        .badge.government {
            background: #4A5899;
            color: white;
        }

        .badge.category {
            background: #6c757d;
            color: white;
        }

        .story-title {
            font-size: 1.3em;
            color: #2c3e50;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .story-source {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .story-description {
            color: #555;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        /* AI Broadcast Copy */
        .broadcast-copy {
            background: #FFFACD;
            border-left: 4px solid #FFD700;
            padding: 15px;
            margin: 12px 0;
            border-radius: 4px;
        }

        .broadcast-copy-label {
            font-weight: 700;
            color: #B8860B;
            margin-bottom: 8px;
            font-size: 13px;
            text-transform: uppercase;
        }

        .broadcast-copy-text {
            color: #333;
            line-height: 1.6;
        }

        /* Press Release Sender Info */
        .sender-info {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 13px;
        }

        .sender-info strong {
            color: #FF6B35;
        }

        .audio-player {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin: 12px 0;
        }

        .audio-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
            color: #666;
        }

        audio {
            width: 100%;
            height: 40px;
        }

        .story-link {
            display: inline-block;
            color: #DC143C;
            text-decoration: none;
            font-weight: 600;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .story-link:hover {
            color: #8B0000;
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .filters {
                flex-direction: column;
            }

            .filter-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">📻</div>
            <h1>NEWSRADIO 1620 - NEWSROOM FEED</h1>
            <p>Professional News Aggregation • AI Broadcast Rewrites • Live Audio</p>
        </div>

        <div class="controls">
            <input type="text" class="search-box" id="search" placeholder="Search stories, sources, keywords...">
            
            <div class="filters">
                <button class="filter-btn active" data-filter="all">ALL</button>
                <button class="filter-btn" data-filter="local">LOCAL</button>
                <button class="filter-btn" data-filter="state">STATE</button>
                <button class="filter-btn" data-filter="national">NATIONAL</button>
                <button class="filter-btn" data-filter="audio">🎧 AUDIO</button>
            </div>

            <div class="category-filters">
                <button class="category-btn press-release" data-category="Press Release">📧 Press Releases</button>
                <button class="category-btn government" data-category="Government">🏛️ Government Leaders</button>
                <button class="category-btn" data-category="Military">🎖️ Military</button>
                <button class="category-btn" data-category="Crime">🚔 Crime</button>
                <button class="category-btn" data-category="Fire">🚒 Fire</button>
                <button class="category-btn" data-category="Weather">🌤️ Weather</button>
                <button class="category-btn" data-category="Traffic">🚗 Traffic</button>
                <button class="category-btn" data-category="Education">🏫 Education</button>
                <button class="category-btn" data-category="Politics">🗳️ Politics</button>
                <button class="category-btn" data-category="Breaking">⚡ Breaking</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat">Total Stories: <strong id="total-count">0</strong></div>
            <div class="stat">Local: <strong id="local-count">0</strong></div>
            <div class="stat">State: <strong id="state-count">0</strong></div>
            <div class="stat">National: <strong id="national-count">0</strong></div>
            <div class="stat">With Audio: <strong id="audio-count">0</strong></div>
            <div class="stat">Last Updated: <strong id="last-updated">--</strong></div>
            <button class="refresh-btn" onclick="loadStories()">🔄 REFRESH</button>
        </div>

        <div class="stories" id="stories">
            <div class="loading">Loading stories...</div>
        </div>
    </div>

    <script>
        let allStories = [];
        let currentFilter = 'all';
        let currentCategory = null;
        let searchTerm = '';

        async function loadStories() {
            try {
                const response = await fetch('https://news.newsradio1620pensacola.workers.dev/');
                const data = await response.json();
                
                if (data.success) {
                    allStories = data.stories;
                    updateStats(data);
                    displayStories();
                }
            } catch (error) {
                document.getElementById('stories').innerHTML = '<div class="loading">Error loading stories. Please refresh.</div>';
            }
        }

        function updateStats(data) {
            document.getElementById('total-count').textContent = data.count;
            document.getElementById('local-count').textContent = data.stories.filter(s => s.region === 'Local').length;
            document.getElementById('state-count').textContent = data.stories.filter(s => s.region === 'State').length;
            document.getElementById('national-count').textContent = data.stories.filter(s => s.region === 'National').length;
            document.getElementById('audio-count').textContent = data.stories.filter(s => s.audioUrl).length;
            
            const updated = new Date(data.updated);
            document.getElementById('last-updated').textContent = updated.toLocaleTimeString();
        }

        function displayStories() {
            let filtered = allStories;

            // Region filter
            if (currentFilter === 'local') {
                filtered = filtered.filter(s => s.region === 'Local');
            } else if (currentFilter === 'state') {
                filtered = filtered.filter(s => s.region === 'State');
            } else if (currentFilter === 'national') {
                filtered = filtered.filter(s => s.region === 'National');
            } else if (currentFilter === 'audio') {
                filtered = filtered.filter(s => s.audioUrl);
            }

            // Category filter
            if (currentCategory) {
                filtered = filtered.filter(s => s.category === currentCategory);
            }

            // Search filter
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filtered = filtered.filter(s => 
                    s.title?.toLowerCase().includes(term) ||
                    s.description?.toLowerCase().includes(term) ||
                    s.source?.toLowerCase().includes(term)
                );
            }

            const storiesHTML = filtered.map(story => {
                const isPressRelease = story.category === 'Press Release' || story.pressRelease;
                const isGovernment = story.category === 'Government';
                const storyClass = isPressRelease ? 'press-release' : (isGovernment ? 'government' : '');
                
                return `
                    <div class="story ${storyClass}">
                        <div class="story-header">
                            <div class="story-meta">
                                <span class="badge ${story.region?.toLowerCase() || 'national'}">${story.region || 'National'}</span>
                                ${isPressRelease ? '<span class="badge press-release">📧 PRESS RELEASE</span>' : ''}
                                ${isGovernment ? '<span class="badge government">🏛️ GOVERNMENT</span>' : ''}
                                ${story.category ? `<span class="badge category">${story.category}</span>` : ''}
                            </div>
                        </div>
                        
                        <h2 class="story-title">${story.title}</h2>
                        <div class="story-source">${story.source}</div>
                        
                        ${story.description ? `<div class="story-description">${story.description}</div>` : ''}
                        
                        ${story.broadcastCopy ? `
                            <div class="broadcast-copy">
                                <div class="broadcast-copy-label">✨ AI Broadcast Copy</div>
                                <div class="broadcast-copy-text">${story.broadcastCopy}</div>
                            </div>
                        ` : ''}
                        
                        ${(story.senderEmail || story.senderName) ? `
                            <div class="sender-info">
                                <strong>From:</strong> ${story.senderName || 'Unknown'} 
                                ${story.senderEmail ? `&lt;${story.senderEmail}&gt;` : ''}
                            </div>
                        ` : ''}
                        
                        ${story.audioUrl ? `
                            <div class="audio-player">
                                <div class="audio-info">
                                    <span>🎧 Audio Available</span>
                                    ${story.trt ? `<span>Duration: ${story.trt}</span>` : ''}
                                </div>
                                <audio controls>
                                    <source src="${story.audioUrl}" type="audio/mpeg">
                                </audio>
                                ${story.outCue ? `<div style="margin-top: 8px; font-size: 13px; color: #666;"><strong>OUT CUE:</strong> ${story.outCue}</div>` : ''}
                            </div>
                        ` : ''}
                        
                        ${story.link && story.link !== '#' ? `<a href="${story.link}" target="_blank" class="story-link">Read Full Story →</a>` : ''}
                    </div>
                `;
            }).join('');

            document.getElementById('stories').innerHTML = storiesHTML || '<div class="loading">No stories match your filters.</div>';
        }

        // Event listeners
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                displayStories();
            });
        });

        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.classList.contains('active')) {
                    btn.classList.remove('active');
                    currentCategory = null;
                } else {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = btn.dataset.category;
                }
                displayStories();
            });
        });

        document.getElementById('search').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            displayStories();
        });

        // Auto-refresh every 5 minutes
        setInterval(loadStories, 5 * 60 * 1000);

        // Load on startup
        loadStories();
    </script>
</body>
</html>
