<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsRadio 1620 - Newsroom & Script Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #8B0000 0%, #DC143C 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #DC143C 0%, #8B0000 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header .logo {
            font-size: 3em;
            margin-bottom: 10px;
        }

        /* TABS */
        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #DC143C;
        }

        .tab {
            flex: 1;
            padding: 15px 20px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            background: #e9ecef;
            border: none;
            transition: all 0.3s;
        }

        .tab:hover {
            background: #dee2e6;
        }

        .tab.active {
            background: white;
            color: #DC143C;
            border-bottom: 3px solid #DC143C;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* SEARCH & FILTERS */
        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #ddd;
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #DC143C;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .filter-btn, .category-btn {
            padding: 10px 20px;
            background: white;
            border: 2px solid #DC143C;
            color: #DC143C;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn:hover, .category-btn:hover {
            background: #DC143C;
            color: white;
        }

        .filter-btn.active, .category-btn.active {
            background: #DC143C;
            color: white;
        }

        /* STATS */
        .stats {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            background: #fff;
            border-bottom: 2px solid #ddd;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stat strong {
            color: #DC143C;
            font-size: 18px;
        }

        /* STORIES */
        .stories {
            padding: 20px 30px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .story {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            position: relative;
        }

        .story:hover {
            border-color: #DC143C;
            box-shadow: 0 4px 12px rgba(220, 20, 60, 0.15);
        }

        .story-title {
            font-size: 1.3em;
            color: #2c3e50;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .add-to-script-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .add-to-script-btn:hover {
            background: #218838;
            transform: scale(1.05);
        }

        /* SCRIPT EDITOR */
        .script-controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .anchor-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .anchor-tab {
            padding: 8px 16px;
            background: white;
            border: 2px solid #6c757d;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .anchor-tab.active {
            background: #DC143C;
            color: white;
            border-color: #DC143C;
        }

        .anchor-tab .count {
            background: #6c757d;
            color: white;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 11px;
            margin-left: 5px;
        }

        .anchor-tab.active .count {
            background: rgba(255,255,255,0.3);
        }

        .script-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .save-btn {
            background: #28a745;
            color: white;
        }

        .print-btn {
            background: #007bff;
            color: white;
        }

        .clear-btn {
            background: #dc3545;
            color: white;
        }

        .new-anchor-btn {
            background: #6c757d;
            color: white;
        }

        /* SCRIPT ITEMS */
        .script-area {
            padding: 20px 30px;
            min-height: 400px;
        }

        .script-item {
            background: #fff;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: move;
        }

        .script-item.dragging {
            opacity: 0.5;
        }

        .script-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .drag-handle {
            font-size: 24px;
            cursor: grab;
            color: #6c757d;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .script-item-number {
            background: #DC143C;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .script-item-actions {
            display: flex;
            gap: 8px;
        }

        .script-item-actions button {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .remove-btn {
            background: #dc3545;
            color: white;
        }

        .move-up-btn, .move-down-btn {
            background: #6c757d;
            color: white;
        }

        .broadcast-copy {
            background: #FFFACD;
            border-left: 4px solid #FFD700;
            padding: 15px;
            margin: 12px 0;
            border-radius: 4px;
        }

        .audio-cue {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin: 12px 0;
            border-radius: 4px;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: #DC143C;
        }

        .anchor-select {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .anchor-option {
            padding: 15px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .anchor-option:hover {
            border-color: #DC143C;
            background: #f8f9fa;
        }

        .anchor-option input {
            margin-right: 10px;
        }

        .warning-box {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 6px;
            padding: 15px;
            margin: 15px 0;
        }

        .warning-box strong {
            color: #856404;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .modal-btn-primary {
            background: #DC143C;
            color: white;
        }

        .modal-btn-secondary {
            background: #6c757d;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            
            .header, .tabs, .controls, .stats, .script-controls {
                display: none !important;
            }
            
            .container {
                box-shadow: none;
            }
            
            .script-item {
                page-break-inside: avoid;
                border: 1px solid #ddd !important;
            }
            
            .script-item-actions, .drag-handle {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">📻</div>
            <h1>NEWSRADIO 1620</h1>
            <p>Newsroom Feed & Script Editor</p>
        </div>

        <!-- TABS -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('feed')">📰 News Feed</button>
            <button class="tab" onclick="switchTab('script')">📝 Script Editor</button>
        </div>

        <!-- TAB 1: NEWS FEED -->
        <div id="feed-tab" class="tab-content active">
            <div class="controls">
                <input type="text" class="search-box" id="search" placeholder="Search stories...">
                
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">ALL</button>
                    <button class="filter-btn" data-filter="local">LOCAL</button>
                    <button class="filter-btn" data-filter="state">STATE</button>
                    <button class="filter-btn" data-filter="national">NATIONAL</button>
                    <button class="filter-btn" data-filter="audio">🎧 AUDIO</button>
                </div>

                <div class="filters">
                    <button class="category-btn" data-category="Press Release">📧 Press Releases</button>
                    <button class="category-btn" data-category="Government">🏛️ Government</button>
                    <button class="category-btn" data-category="Military">🎖️ Military</button>
                    <button class="category-btn" data-category="Crime">🚔 Crime</button>
                    <button class="category-btn" data-category="Fire">🚒 Fire</button>
                    <button class="category-btn" data-category="Weather">🌤️ Weather</button>
                    <button class="category-btn" data-category="Traffic">🚗 Traffic</button>
                </div>
            </div>

            <div class="stats">
                <div class="stat">Total: <strong id="total-count">0</strong></div>
                <div class="stat">Local: <strong id="local-count">0</strong></div>
                <div class="stat">With Audio: <strong id="audio-count">0</strong></div>
                <button class="action-btn save-btn" onclick="loadStories()">🔄 Refresh</button>
            </div>

            <div class="stories" id="stories">
                <div class="empty-state">Loading stories...</div>
            </div>
        </div>

        <!-- TAB 2: SCRIPT EDITOR -->
        <div id="script-tab" class="tab-content">
            <div class="script-controls">
                <div class="anchor-tabs" id="anchor-tabs">
                    <!-- Dynamically populated -->
                </div>
                
                <div class="script-actions">
                    <button class="action-btn new-anchor-btn" onclick="createNewAnchor()">➕ New Anchor</button>
                    <button class="action-btn" style="background: #17a2b8; color: white;" onclick="addBlankStory()">📝 Add Blank Story</button>
                    <button class="action-btn" style="background: #6f42c1; color: white;" onclick="document.getElementById('audioUpload').click()">🎵 Upload Audio</button>
                    <input type="file" id="audioUpload" accept="audio/*" style="display: none;" onchange="handleAudioUpload(event)">
                    <button class="action-btn save-btn" onclick="saveAllScripts()">💾 Save</button>
                    <button class="action-btn print-btn" onclick="printScript()">🖨️ Print</button>
                    <button class="action-btn clear-btn" onclick="clearCurrentScript()">🗑️ Clear</button>
                </div>
            </div>

            <div class="script-area" id="script-area">
                <div class="empty-state">
                    <h3>No stories in script yet</h3>
                    <p>Go to the News Feed tab and click "Add to Script" on stories</p>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: Select Anchor -->
    <div id="anchor-modal" class="modal">
        <div class="modal-content">
            <h3>Add Story to Script</h3>
            <div class="anchor-select" id="anchor-select">
                <!-- Dynamically populated -->
            </div>
            <div id="duplicate-warning" style="display: none;" class="warning-box">
                <strong>⚠️ Warning:</strong>
                <p id="duplicate-message"></p>
            </div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="modal-btn modal-btn-primary" onclick="confirmAddToScript()">Add to Script</button>
            </div>
        </div>
    </div>

    <script>
        // STATE
        let allStories = [];
        let scripts = {};
        let currentAnchor = 'Main';
        let pendingStory = null;
        let currentFilter = 'all';
        let currentCategory = null;
        let searchTerm = '';

        // INIT
        loadScripts();
        loadStories();
        renderAnchorTabs();

        // LOAD FROM API
        async function loadStories() {
            try {
                const res = await fetch('https://news.newsradio1620pensacola.workers.dev/');
                const data = await res.json();
                if (data.success) {
                    allStories = data.stories;
                    updateStats(data);
                    displayStories();
                }
            } catch (e) {
                console.error(e);
            }
        }

        // UPDATE STATS
        function updateStats(data) {
            document.getElementById('total-count').textContent = data.count;
            document.getElementById('local-count').textContent = data.stories.filter(s => s.region === 'Local').length;
            document.getElementById('audio-count').textContent = data.stories.filter(s => s.audioUrl).length;
        }

        // DISPLAY STORIES
        function displayStories() {
            let filtered = allStories;

            if (currentFilter === 'local') filtered = filtered.filter(s => s.region === 'Local');
            else if (currentFilter === 'state') filtered = filtered.filter(s => s.region === 'State');
            else if (currentFilter === 'national') filtered = filtered.filter(s => s.region === 'National');
            else if (currentFilter === 'audio') filtered = filtered.filter(s => s.audioUrl);

            if (currentCategory) {
                filtered = filtered.filter(s => s.category === currentCategory);
            }

            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filtered = filtered.filter(s => 
                    s.title?.toLowerCase().includes(term) ||
                    s.description?.toLowerCase().includes(term) ||
                    s.source?.toLowerCase().includes(term)
                );
            }

            const html = filtered.map((story, idx) => `
                <div class="story">
                    <button class="add-to-script-btn" onclick='showAnchorModal(${JSON.stringify(story).replace(/'/g, "&apos;")})'>
                        ➕ Add to Script
                    </button>
                    <h2 class="story-title">${story.title}</h2>
                    <p style="color: #666; margin-bottom: 10px;">${story.source} • ${story.region}</p>
                    ${story.description ? `<p>${story.description.substring(0, 200)}...</p>` : ''}
                    ${story.broadcastCopy ? `<div class="broadcast-copy"><strong>AI Copy:</strong> ${story.broadcastCopy}</div>` : ''}
                    ${story.audioUrl ? `
                        <div class="audio-cue">
                            <div style="margin-bottom: 8px;">🎧 Audio Available • ${story.trt || 'Duration unknown'}</div>
                            <audio controls style="width: 100%; max-width: 500px;">
                                <source src="${story.audioUrl}" type="audio/mpeg">
                            </audio>
                            ${story.outCue ? `<div style="margin-top: 8px; font-size: 13px;"><strong>OUT:</strong> "${story.outCue}"</div>` : ''}
                        </div>
                    ` : ''}
                    ${story.link && story.link !== '#' ? `
                        <a href="${story.link}" target="_blank" style="display: inline-block; margin-top: 12px; padding: 8px 16px; background: #DC143C; color: white; text-decoration: none; border-radius: 4px; font-weight: 600; transition: all 0.3s;" onmouseover="this.style.background='#8B0000'" onmouseout="this.style.background='#DC143C'">
                            Read Full Story →
                        </a>
                    ` : ''}
                    ${story.link && story.link !== '#' ? `
                        <a href="${story.link}" target="_blank" style="display: inline-block; margin-top: 10px; color: #DC143C; font-weight: 600; text-decoration: none;">
                            📰 Read Full Story →
                        </a>
                    ` : ''}
                    ${story.link && story.link !== '#' ? `
                        <a href="${story.link}" target="_blank" style="display: inline-block; margin-top: 10px; color: #DC143C; font-weight: 600; text-decoration: none;">
                            📄 Read Full Story →
                        </a>
                    ` : ''}
                </div>
            `).join('');

            document.getElementById('stories').innerHTML = html || '<div class="empty-state">No stories found</div>';
        }

        // FILTERS
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                displayStories();
            });
        });

        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.classList.contains('active')) {
                    btn.classList.remove('active');
                    currentCategory = null;
                } else {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = btn.dataset.category;
                }
                displayStories();
            });
        });

        document.getElementById('search').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            displayStories();
        });

        // TABS
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            
            if (tab === 'feed') {
                document.querySelector('[onclick="switchTab(\'feed\')"]').classList.add('active');
                document.getElementById('feed-tab').classList.add('active');
            } else {
                document.querySelector('[onclick="switchTab(\'script\')"]').classList.add('active');
                document.getElementById('script-tab').classList.add('active');
                renderScript();
            }
        }

        // SCRIPT MANAGEMENT
        function loadScripts() {
            const saved = localStorage.getItem('newsroom_scripts');
            scripts = saved ? JSON.parse(saved) : { 'Main': [] };
        }

        function saveAllScripts() {
            localStorage.setItem('newsroom_scripts', JSON.stringify(scripts));
            alert('✅ All scripts saved!');
        }

        function renderAnchorTabs() {
            const html = Object.keys(scripts).map(anchor => `
                <div class="anchor-tab ${anchor === currentAnchor ? 'active' : ''}" onclick="switchAnchor('${anchor}')">
                    ${anchor} <span class="count">${scripts[anchor].length}</span>
                </div>
            `).join('');
            document.getElementById('anchor-tabs').innerHTML = html;
        }

        function switchAnchor(anchor) {
            currentAnchor = anchor;
            renderAnchorTabs();
            renderScript();
        }

        function createNewAnchor() {
            const name = prompt('Enter anchor name:');
            if (name && !scripts[name]) {
                scripts[name] = [];
                currentAnchor = name;
                renderAnchorTabs();
                renderScript();
            }
        }

        function showAnchorModal(story) {
            pendingStory = story;
            
            // Populate anchor options
            const anchorsHTML = Object.keys(scripts).map(anchor => `
                <label class="anchor-option">
                    <input type="radio" name="anchor" value="${anchor}" ${anchor === currentAnchor ? 'checked' : ''}>
                    <strong>${anchor}'s Script</strong> (${scripts[anchor].length} stories)
                </label>
            `).join('');
            
            document.getElementById('anchor-select').innerHTML = anchorsHTML;
            
            // Check for duplicates
            const duplicate = findDuplicate(story);
            if (duplicate) {
                document.getElementById('duplicate-warning').style.display = 'block';
                document.getElementById('duplicate-message').textContent = 
                    `This story was already added to ${duplicate.anchor}'s Script at ${new Date(duplicate.addedAt).toLocaleTimeString()}`;
            } else {
                document.getElementById('duplicate-warning').style.display = 'none';
            }
            
            document.getElementById('anchor-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('anchor-modal').classList.remove('active');
            pendingStory = null;
        }

        function findDuplicate(story) {
            for (let anchor in scripts) {
                const found = scripts[anchor].find(s => s.guid === story.guid);
                if (found) return { anchor, addedAt: found.addedAt };
            }
            return null;
        }

        function confirmAddToScript() {
            const selected = document.querySelector('input[name="anchor"]:checked');
            if (!selected || !pendingStory) return;
            
            const anchor = selected.value;
            scripts[anchor].push({
                ...pendingStory,
                addedAt: new Date().toISOString()
            });
            
            closeModal();
            renderAnchorTabs();
            alert(`✅ Added to ${anchor}'s Script!`);
        }

        function renderScript() {
            const items = scripts[currentAnchor] || [];
            
            if (items.length === 0) {
                document.getElementById('script-area').innerHTML = `
                    <div class="empty-state">
                        <h3>No stories in ${currentAnchor}'s script yet</h3>
                        <p>Go to News Feed and add some stories</p>
                    </div>
                `;
                return;
            }
            
            const html = items.map((story, idx) => `
                <div class="script-item" draggable="true" data-index="${idx}">
                    <div class="script-item-header">
                        <span class="drag-handle">☰</span>
                        <span class="script-item-number">Story ${idx + 1}</span>
                        <div class="script-item-actions">
                            <button class="move-up-btn" onclick="moveStory(${idx}, -1)">↑</button>
                            <button class="move-down-btn" onclick="moveStory(${idx}, 1)">↓</button>
                            <button class="remove-btn" onclick="removeStory(${idx})">✕</button>
                        </div>
                    </div>
                    
                    <div contenteditable="true" style="outline: none; padding: 10px; border: 1px dashed #ddd; border-radius: 4px; margin: 10px 0;" onblur="updateStoryContent(${idx}, 'title', this.textContent)">
                        <h3 style="margin: 0;">${story.title}</h3>
                    </div>
                    
                    <p style="color: #666; margin: 8px 0;">${story.source} • ${story.region}</p>
                    
                    ${story.description ? `
                        <div style="margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 4px;">
                            <strong>Original Story:</strong><br>
                            ${story.description}
                        </div>
                    ` : ''}
                    
                    ${story.broadcastCopy ? `
                        <div class="broadcast-copy">
                            <strong>📝 BROADCAST COPY:</strong><br>
                            <div contenteditable="true" style="outline: none; margin-top: 8px;" onblur="updateStoryContent(${idx}, 'broadcastCopy', this.textContent)">
                                ${story.broadcastCopy}
                            </div>
                        </div>
                    ` : `
                        <div class="broadcast-copy">
                            <strong>📝 BROADCAST COPY:</strong><br>
                            <div contenteditable="true" style="outline: none; margin-top: 8px; min-height: 60px;" onblur="updateStoryContent(${idx}, 'broadcastCopy', this.textContent)" placeholder="Type your broadcast copy here...">
                                ${story.description ? story.description.substring(0, 300) : 'Type your script here...'}
                            </div>
                        </div>
                    `}
                    
                    ${story.audioUrl ? `
                        <div class="audio-cue">
                            <strong>🎧 AUDIO CUE:</strong><br>
                            Duration: ${story.trt || 'Unknown'}<br>
                            ${story.outCue ? `OUT: "${story.outCue}"<br>` : ''}
                            <audio controls style="width: 100%; margin-top: 8px;">
                                <source src="${story.audioUrl}" type="audio/mpeg">
                            </audio>
                        </div>
                    ` : `
                        <div style="margin-top: 15px; padding: 10px; background: #e3f2fd; border-radius: 4px;">
                            <strong>🎧 Add Audio:</strong><br>
                            <input type="file" accept="audio/*" onchange="handleAudioUpload(${idx}, this)" style="margin-top: 8px;">
                            <div style="font-size: 12px; color: #666; margin-top: 5px;">Upload MP3, WAV, or other audio file</div>
                        </div>
                    `}
                    
                    <div style="margin-top: 15px; padding: 10px; background: #f8f9fa; border-radius: 4px;">
                        <strong>📝 Notes/Instructions:</strong>
                        <div contenteditable="true" style="outline: none; margin-top: 8px; min-height: 40px;" onblur="updateStoryContent(${idx}, 'notes', this.textContent)" placeholder="Add production notes, timing, or special instructions...">
                            ${story.notes || ''}
                        </div>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('script-area').innerHTML = html;
            enableDragDrop();
        }

        function moveStory(idx, direction) {
            const items = scripts[currentAnchor];
            const newIdx = idx + direction;
            if (newIdx < 0 || newIdx >= items.length) return;
            
            [items[idx], items[newIdx]] = [items[newIdx], items[idx]];
            renderScript();
        }

        function removeStory(idx) {
            if (confirm('Remove this story from script?')) {
                scripts[currentAnchor].splice(idx, 1);
                renderAnchorTabs();
                renderScript();
            }
        }

        function clearCurrentScript() {
            if (confirm(`Clear all stories from ${currentAnchor}'s script?`)) {
                scripts[currentAnchor] = [];
                renderAnchorTabs();
                renderScript();
            }
        }

        function printScript() {
            window.print();
        }

        // DRAG & DROP
        function enableDragDrop() {
            const items = document.querySelectorAll('.script-item');
            items.forEach(item => {
                item.addEventListener('dragstart', handleDragStart);
                item.addEventListener('dragover', handleDragOver);
                item.addEventListener('drop', handleDrop);
                item.addEventListener('dragend', handleDragEnd);
            });
        }

        let draggedItem = null;

        function handleDragStart(e) {
            draggedItem = this;
            this.classList.add('dragging');
        }

        function handleDragOver(e) {
            e.preventDefault();
        }

        function handleDrop(e) {
            e.preventDefault();
            if (draggedItem === this) return;
            
            const fromIdx = parseInt(draggedItem.dataset.index);
            const toIdx = parseInt(this.dataset.index);
            
            const items = scripts[currentAnchor];
            const [item] = items.splice(fromIdx, 1);
            items.splice(toIdx, 0, item);
            
            renderScript();
        }

        function handleDragEnd() {
            this.classList.remove('dragging');
        }

        // UPDATE STORY CONTENT
        function updateStoryContent(idx, field, value) {
            if (scripts[currentAnchor][idx]) {
                scripts[currentAnchor][idx][field] = value;
                saveAllScripts();
            }
        }

        // ADD BLANK STORY
        function addBlankStory() {
            const blankStory = {
                title: 'New Story - Click to Edit',
                source: 'Custom',
                region: 'Local',
                description: '',
                broadcastCopy: 'Type your script here...',
                category: 'General',
                guid: `custom-${Date.now()}`,
                addedAt: new Date().toISOString(),
                notes: ''
            };
            
            scripts[currentAnchor].push(blankStory);
            renderAnchorTabs();
            renderScript();
        }

        // HANDLE AUDIO UPLOAD
        function handleAudioUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // Check if audio file
            if (!file.type.startsWith('audio/')) {
                alert('Please select an audio file (MP3, WAV, etc.)');
                return;
            }
            
            // Convert to base64 for storage
            const reader = new FileReader();
            reader.onload = function(e) {
                const audioData = e.target.result;
                
                // Create a new story with the uploaded audio
                const audioStory = {
                    title: `Audio: ${file.name}`,
                    source: 'Custom Upload',
                    region: 'Local',
                    description: `Uploaded audio file: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`,
                    broadcastCopy: 'Write your intro/outro copy here...',
                    category: 'General',
                    guid: `audio-upload-${Date.now()}`,
                    addedAt: new Date().toISOString(),
                    audioUrl: audioData,
                    audioFileName: file.name,
                    trt: ':00', // Duration unknown without processing
                    notes: '⚠️ Note: Audio is stored locally. After VPS setup, files will upload to cloud storage.'
                };
                
                scripts[currentAnchor].push(audioStory);
                renderAnchorTabs();
                renderScript();
                
                alert(`✅ Audio "${file.name}" added to ${currentAnchor}'s script!\n\nNote: Currently stored locally. Will upload to cloud after VPS setup.`);
            };
            
            reader.readAsDataURL(file);
        }

        // Auto-refresh
        setInterval(loadStories, 5 * 60 * 1000);
    </script>
</body>
</html>
